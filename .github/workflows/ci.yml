name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: smoke CLI
        run: node dist/cli.js examples/run.jsonl --no-color
      - name: smoke --json
        run: node dist/cli.js examples/run.jsonl --json | node -e "JSON.parse(require('fs').readFileSync(0,'utf8'))"
